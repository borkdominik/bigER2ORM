dependencies {
	api project(':org.big.orm')
	api "org.eclipse.xtext:org.eclipse.xtext.ide:${xtextVersion}"
	api "org.eclipse.xtext:org.eclipse.xtext.xbase.ide:${xtextVersion}"
	implementation 'org.eclipse.core:org.eclipse.core.resources:3.7.100'
	
	api "org.eclipse.sprotty:org.eclipse.sprotty.server:${sprottyVersion}"
	api "org.eclipse.sprotty:org.eclipse.sprotty.xtext:${sprottyVersion}"
	
	api "org.eclipse.sprotty:org.eclipse.sprotty.layout:${sprottyVersion}"
	api "org.eclipse.elk:org.eclipse.elk.alg.libavoid:${elkVersion}"
	api "org.eclipse.elk:org.eclipse.elk.alg.layered:${elkVersion}"

	implementation 'commons-io:commons-io:2.11.0'
}

apply plugin: "org.xtext.builder"

apply plugin: 'application'
startScripts {
    classpath = files( '$APP_HOME/lib/*' )
}
mainClassName = "org.big.orm.ide.launch.OrmModelServerLauncher"
applicationName = 'orm-language-server'

task unzipServer(type: Copy, dependsOn: distZip) {
	def zipFile = file("${buildDir}/distributions/orm-language-server.zip")
	def outputDir = file("${buildDir}/../../../extension/server")

	from zipTree(zipFile)
	into outputDir
}

build.dependsOn unzipServer

task generateOrmCode(type: JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'org.big.orm.ide.generator.StandaloneGeneratorMain'
	
	def fileArg = project.hasProperty('ormFile') ? project.getProperty('ormFile') : ''
	def outArg = project.hasProperty('outputDir') ? project.getProperty('outputDir') : ''
	def langArg = project.hasProperty('language') ? project.getProperty('language') : 'all'
	
	args = [fileArg, outArg, langArg]
}

task reverseOrmCode(type: JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'org.big.orm.ide.generator.StandaloneReverseMain'
	
	def inputArg = project.hasProperty('inputDir') ? project.getProperty('inputDir') : ''
	def outArg = project.hasProperty('outputFile') ? project.getProperty('outputFile') : ''
	def modelNameArg = project.hasProperty('modelName') ? project.getProperty('modelName') : 'example'
	
	args = [inputArg, outArg, modelNameArg]
}